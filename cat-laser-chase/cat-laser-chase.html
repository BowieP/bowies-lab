<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Laser Chase</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: sans-serif; }
        #score { position: absolute; top: 10px; left: 10px; color: white; font-size: 24px; z-index: 10; pointer-events: none; }
        #settings-container { position: absolute; top: 10px; left: 120px; z-index: 10; }
        #settings-menu { display: none; background: #333; color: white; padding: 15px; border-radius: 8px; position: absolute; top: 40px; }
        #dot { 
            background-color: red; 
            border-radius: 50%; 
            position: absolute; 
            cursor: pointer; 
            transition: left 0.5s linear, top 0.5s linear;
        }
        label { display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="score">Score: 0</div>
    <div id="settings-container">
        <button onclick="toggleSettings()">Settings</button>
        <div id="settings-menu">
            <label>Color: 
                <select id="color" onchange="updateVisuals()">
                    <option value="red">Red</option>
                    <option value="white">White</option>
                    <option value="blue">Blue</option>
                    <option value="green">Green</option>
                    <option value="yellow">Yellow</option>
                </select>
            </label>
            <label>Size: <input type="range" id="size" min="20" max="100" value="50" onchange="updateVisuals()"></label>
            <label>Speed: 
                <input type="range" id="speed" min="0.2" max="2" step="0.1" value="0.5" onchange="updateSpeed()">
            </label>
        </div>
    </div>

    <div id="dot" onclick="scorePoint()"></div>

    <script>
        let score = 0;
        let speed = 0.5;
        let gameTimer;

        function toggleSettings() {
            const menu = document.getElementById('settings-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function updateVisuals() {
            const dot = document.getElementById('dot');
            dot.style.backgroundColor = document.getElementById('color').value;
            dot.style.width = document.getElementById('size').value + 'px';
            dot.style.height = document.getElementById('size').value + 'px';
        }

        function updateSpeed() {
            const sliderValue = parseFloat(document.getElementById('speed').value);
            // Reversed: higher slider = faster movement
            speed = 2.2 - sliderValue;
            document.getElementById('dot').style.transition = `left ${speed}s linear, top ${speed}s linear`;
            
            clearInterval(gameTimer);
            gameTimer = setInterval(moveDot, speed * 1000 + 500);
        }

        function moveDot() {
            const dot = document.getElementById('dot');
            const size = parseInt(document.getElementById('size').value);
            const newX = Math.random() * (window.innerWidth - size);
            const newY = Math.random() * (window.innerHeight - size);
            dot.style.left = newX + 'px';
            dot.style.top = newY + 'px';
        }

        function scorePoint() {
            score++;
            document.getElementById('score').innerText = 'Score: ' + score;
            // Immediate move
            moveDot();
        }

        // Setup initial values
        updateVisuals();
        updateSpeed();
        moveDot();
    </script>
</body>
</html>
